name: APK

on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Derle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk EvrimArsivi.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Evrim Arşivi uygulaması" --notes "Telefona kurmak için EvrimArsivi.apk dosyasını indirin."
          gh release upload app EvrimArsivi.apk --clobber
